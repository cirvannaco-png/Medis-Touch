[alembic]
script_location = migrations
prepend_sys_path = .

# sqlalchemy.url is intentionally omitted here - migrations/env.py pulls it
# from app.config.settings (the same DATABASE_URL the app itself uses) so
# there is exactly one place the DB URL is configured, not two that can drift.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
