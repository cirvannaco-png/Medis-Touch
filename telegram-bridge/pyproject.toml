[project]
name = "medis-touch-telegram"
version = "1.4.0"
description = "Medis Touch MT5 to Telegram bridge"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.140.0",
    "uvicorn[standard]==0.52.1",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "loguru==0.7.3",
    "sqlalchemy[asyncio]==2.0.25",
    "asyncpg==0.31.0",
    "aiosqlite==0.19.0",
    "alembic==1.18.5",
    "python-telegram-bot==21.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "bandit==1.8.0",
    "pip-audit==2.10.1",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Ruff 0.16 expanded its default rule set substantially. Keep the bridge
# gate deterministic while the existing codebase is migrated deliberately;
# this is the pre-0.16 baseline and catches syntax/import/pyflakes failures.
# New rule families can then be enabled and remediated in separate commits.
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "B008",   # Depends(...) in defaults is FastAPI's standard idiom, not a bug
    "BLE001", # blind `except Exception` used only as documented, last-resort
              # boundaries (startup token check, retry loop, DB health probe)
              # that must never crash the process - narrowing them risks
              # missing an unanticipated failure mode.
]
