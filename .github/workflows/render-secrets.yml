name: Sync Render secrets

# Manual (or post-deploy) automation for the env vars render.yaml marks
# `sync: false`. Values live in GitHub repository secrets; this workflow
# pushes them to Render and triggers a redeploy so the service actually
# restarts with them.
#
# Required repository secrets:
#   RENDER_API_KEY     - Render dashboard -> Account Settings -> API Keys
#   RENDER_SERVICE_ID  - srv-... id from the service URL
#   BOT_TOKEN, CHAT_ID, SECRET_KEY
# Optional:
#   WEBHOOK_SECRET_TOKEN - omit to have a fresh Telegram-compatible token
#                          generated (openssl rand -hex 32 equivalent)

on:
  workflow_dispatch:
    inputs:
      rotate_webhook_secret:
        description: "Generate a brand new WEBHOOK_SECRET_TOKEN instead of using the stored one"
        type: boolean
        default: false
      deploy:
        description: "Trigger a Render deploy after syncing"
        type: boolean
        default: true

concurrency:
  group: render-secrets
  cancel-in-progress: false

defaults:
  run:
    working-directory: telegram-bridge

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync secrets to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          WEBHOOK_SECRET_TOKEN: ${{ inputs.rotate_webhook_secret && '' || secrets.WEBHOOK_SECRET_TOKEN }}
        run: |
          python scripts/render_sync_secrets.py ${{ inputs.deploy && '' || '--no-deploy' }}
