name: medis-touch handbook CI

# Backend, Telegram bridge, and MQL5 structural validation. MetaEditor is
# terminal/Windows-bound, so the Ubuntu lane deliberately does not pretend
# that static parsing is equivalent to a real MQL5 compile.
# CI note: Telegram Bridge Ruff baseline is enforced explicitly in its pyproject.
on:
  push:
    paths:
      - "medis_touch/**"
      - "telegram-bridge/**"
      - "EA/**"
      - "tools/validate_mql5_structure.py"
      - ".github/workflows/medis-touch-ci.yml"
  pull_request:
    paths:
      - "medis_touch/**"
      - "telegram-bridge/**"
      - "EA/**"
      - "tools/validate_mql5_structure.py"
      - ".github/workflows/medis-touch-ci.yml"
  workflow_dispatch:

concurrency:
  group: medis-touch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  medis-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medis_touch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            medis_touch/requirements.txt
            medis_touch/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app/ tests/
      - name: Security scan (bandit)
        run: bandit -r app/ -q
      - name: Test (pytest)
        run: pytest -v

  telegram-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: telegram-bridge/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app/ tests/
      - name: Security scan (bandit)
        run: bandit -r app/ -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Test (pytest)
        run: pytest -v
      - name: Import smoke test
        run: python -c "from app.main import create_app; create_app()"

  mql5-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate MQL5 structure
        run: python tools/validate_mql5_structure.py
