name: medis-touch handbook CI

# Lints, security-scans and tests the handbook reference implementation
# (medis_touch/). The MQL5 tree is validated by a separate fast static job;
# MetaEditor is terminal/Windows-bound and is therefore not available on the
# Ubuntu runner.
on:
  push:
    paths:
      - "medis_touch/**"
      - "EA/**"
      - "tools/validate_mql5_structure.py"
      - ".github/workflows/medis-touch-ci.yml"
  pull_request:
    paths:
      - "medis_touch/**"
      - "EA/**"
      - "tools/validate_mql5_structure.py"
      - ".github/workflows/medis-touch-ci.yml"
  workflow_dispatch:

concurrency:
  group: medis-touch-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    if: contains(toJson(github.event.commits.*.modified), 'medis_touch/') || github.event_name != 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medis_touch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            medis_touch/requirements.txt
            medis_touch/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/ tests/

      - name: Security scan (bandit)
        run: bandit -r app/ -q

      - name: Test (pytest)
        run: pytest -v

  mql5-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate MQL5 structure
        run: python tools/validate_mql5_structure.py
